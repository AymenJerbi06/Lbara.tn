<!DOCTYPE html>
<html class="light" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Forgot Password - Lbara.tn</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Nunito:wght@400;500;600;700;800&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script id="tailwind-config">
  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        colors: { "primary": "#003060", "secondary": "#005F4B", "accent": "#B8860B", "on-surface": "#1A202C" },
        fontFamily: { "headline": ["Quicksand", "sans-serif"], "body": ["Nunito", "sans-serif"] },
        borderRadius: { "DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "2xl": "2rem", "full": "9999px" },
      },
    },
  }
</script>
<style type="text/tailwindcss">
  @layer base { body { @apply bg-white text-on-surface font-body; } }
  .vibrant-gradient { background: linear-gradient(135deg, #001F3F 0%, #000C1A 100%); }
  .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
  .cartoon-card { @apply bg-white border-4 border-primary shadow-[8px_8px_0px_0px_#003060] transition-all; }
  .cartoon-button { @apply border-2 border-primary shadow-[4px_4px_0px_0px_#003060] transition-all active:translate-x-[2px] active:translate-y-[2px] active:shadow-none; }
  .cartoon-input { @apply border-2 border-primary rounded-xl px-4 py-3 focus:ring-0 focus:border-accent transition-colors font-bold text-primary placeholder:text-primary/30; }
</style>
</head>
<body class="selection:bg-primary/30 selection:text-primary">

<nav class="fixed top-0 w-full z-50 bg-white/90 backdrop-blur-md border-b-2 border-primary/10">
  <div class="flex justify-between items-center w-full px-4 lg:px-8 py-4 max-w-screen-2xl mx-auto">
    <a href="/index.html" class="text-2xl lg:text-3xl font-bold tracking-tight text-primary font-headline flex-shrink-0">Lbara.tn</a>
    <div class="hidden lg:flex items-center gap-8 font-headline font-bold text-sm">
      <a class="text-on-surface/70 hover:text-primary transition-colors" href="/index.html">Home</a>
      <a class="text-on-surface/70 hover:text-primary transition-colors" href="/shop.html">Shop</a>
      <a class="text-on-surface/70 hover:text-primary transition-colors" href="/faq.html">FAQ</a>
      <a class="text-on-surface/70 hover:text-primary transition-colors" href="/contact.html">Contact</a>
    </div>
  </div>
</nav>

<main class="vibrant-gradient min-h-screen pt-32 pb-24 flex items-center justify-center px-6">
  <div class="w-full max-w-lg">
    <div class="cartoon-card rounded-3xl p-8 md:p-12 relative">
      <div class="absolute -top-12 left-1/2 -translate-x-1/2">
        <div class="w-24 h-24 bg-white border-4 border-primary rounded-full flex items-center justify-center shadow-lg">
          <span class="material-symbols-outlined text-primary text-5xl" style="font-variation-settings:'FILL' 1;">lock_reset</span>
        </div>
      </div>
      <div class="text-center mt-8 mb-10">
        <h1 class="font-headline text-3xl font-black text-primary uppercase tracking-tight">Forgot Password</h1>
        <p class="text-primary/60 font-bold mt-2">Enter your email and we'll send you a reset link.</p>
        <div id="msg" style="display:none" class="mt-4 px-4 py-3 rounded-xl font-bold text-sm"></div>
      </div>
      <div class="space-y-6">
        <div>
          <label class="block text-sm font-black text-primary uppercase tracking-widest mb-2 px-1">Email Address</label>
          <input id="reset-email" class="w-full cartoon-input" placeholder="your@email.com" type="email"/>
        </div>
        <button id="send-btn" class="w-full cartoon-button bg-primary text-white font-black py-4 rounded-2xl text-xl flex items-center justify-center gap-3">
          <span class="material-symbols-outlined">send</span>
          Send Reset Link
        </button>
      </div>
      <div class="mt-10 pt-8 border-t-4 border-dashed border-primary/10 text-center">
        <a class="inline-flex items-center gap-2 text-primary font-black hover:text-accent transition-colors" href="/login.html">
          <span class="material-symbols-outlined">arrow_back</span>
          Back to Login
        </a>
      </div>
    </div>
  </div>
</main>

<script src="/js/api.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  var btn = document.getElementById('send-btn');
  var emailInput = document.getElementById('reset-email');
  var msgEl = document.getElementById('msg');

  function showMsg(text, ok) {
    msgEl.textContent = text;
    msgEl.style.display = 'block';
    msgEl.style.background = ok ? '#f0fdf4' : '#fef2f2';
    msgEl.style.border = '2px solid ' + (ok ? '#16a34a' : '#dc2626');
    msgEl.style.color = ok ? '#16a34a' : '#dc2626';
  }

  btn.addEventListener('click', function () {
    var email = emailInput.value.trim();
    if (!email || !email.includes('@')) {
      showMsg('Please enter a valid email address.', false);
      return;
    }

    btn.disabled = true;
    btn.innerHTML = '<span class="material-symbols-outlined animate-spin">autorenew</span> Sending...';

    fetch('/api/auth/forgot-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: email }),
    })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        showMsg(data.message || 'Something went wrong.', data.success !== false);
      })
      .catch(function () {
        showMsg('Could not reach the server. Please try again.', false);
      })
      .finally(function () {
        btn.disabled = false;
        btn.innerHTML = '<span class="material-symbols-outlined">send</span> Send Reset Link';
      });
  });
});
</script>
</body>
</html>
